name: Verify samples

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TODO(Phase 1): install the 6502 emulator CLI and cc65 on the runner,
      # then run `npm run preflight` before the harness.
      - name: Run sample harness
        run: npm run verify

      - name: Build docs
        run: npm run docs:build
