name: Verify samples

on:
  push:
  pull_request:

# The emulator CLI, cc65 and cffs are all built from source here. None ships as
# a package the runner already has: the CLI lives inside the desktop app, cc65
# in every distro is still the 2.19 release from 2020, and cffs is a standalone
# tool with no package published anywhere.
env:
  # Pinned so a red build means the docs changed, not that an upstream did.
  # The emulator ref is a tag rather than a branch because `preflight` now
  # checks `6502 --version` against `data/emulator.json` — the site's samples,
  # screenshots and embedded payloads all came off one release, and a run on a
  # different one is not the check it looks like. Bump both together.
  EMULATOR_REF: v2.6.2
  CC65_REF: master
  CFFS_REF: main
  BASTOK_REF: main

jobs:
  # Cheap, dependency-free checks on the migrated assets. Split out from
  # `verify` so a broken card reports in seconds rather than behind a cc65 build.
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The docs are a user's guide. This fails the build if the verification
      # machinery that keeps them honest leaks back into the prose — see
      # PLAN.md's "Voice & Style".
      - name: Check the docs' voice
        run: npm run check:voice

      - name: Check the reference cards
        run: npm run cards:check

      # Six of the cards are generated from `data/` — a stale checked-in copy
      # would print a machine that no longer exists, which is exactly how the
      # originals ended up documenting a v1.0 ROM. Neither script needs deps.
      - name: Check the generated cards are current
        run: npm run cards:verify

      # The diagrams are drawn from the same data, and drift the same way.
      - name: Check the diagrams are current
        run: npm run diagrams:verify

      # The photographs are imported from the KiCad repos on a machine that has
      # them checked out, so CI only asks whether every one a page references is
      # committed here.
      - name: Check every photograph is present
        run: npm run photos:check

      # Same arrangement as the photographs: drawing them needs ImageMagick and
      # a Mac system font, so the outputs are committed and CI only asks whether
      # each one is present at the size the manifest and the head tags promise.
      - name: Check every icon is present
        run: npm run icons:check

      # The migration is only evidence for retiring 6502-ASSETS if it is still
      # true. This re-walks that repo and fails if it holds a path this repo does
      # not account for. Drop the step once 6502-ASSETS is deleted (Phase 10
      # archives it first, and an archived repo still checks out).
      - name: Checkout 6502-ASSETS
        uses: actions/checkout@v7
        with:
          repository: acwright/6502-ASSETS
          path: .assets

      - name: Check migration coverage
        run: npm run migrate:check -- --source "$GITHUB_WORKSPACE/.assets"

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- The emulator CLI -------------------------------------------------
      # `npm run build:cli` is a plain tsc pass producing Node-runnable JS, so
      # --ignore-scripts (which skips Electron's ~100 MB postinstall download)
      # is enough to build it.
      - name: Checkout the emulator
        uses: actions/checkout@v7
        with:
          repository: acwright/6502-EMULATOR
          ref: ${{ env.EMULATOR_REF }}
          path: .emulator

      - name: Build the emulator CLI
        working-directory: .emulator
        run: |
          npm ci --ignore-scripts
          npm run build:cli

      - name: Point the harness at it
        run: echo "SIXFIVEOHTWO=node $GITHUB_WORKSPACE/.emulator/out/cli/index.js" >> "$GITHUB_ENV"

      # --- cffs ---------------------------------------------------------------
      # `console storage` samples build a CompactFlash image with it before the
      # machine boots. Unlike the emulator, the harness shells out to a `cffs`
      # on PATH rather than an overridable command, so this installs a wrapper
      # rather than pointing an env var at the checkout.
      - name: Checkout cffs
        uses: actions/checkout@v7
        with:
          repository: acwright/cffs
          ref: ${{ env.CFFS_REF }}
          path: .cffs

      - name: Build cffs
        working-directory: .cffs
        run: |
          npm ci
          npm run build

      - name: Put cffs on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec node "%s/.cffs/dist/cli.js" "$@"\n' "$GITHUB_WORKSPACE" > "$HOME/.local/bin/cffs"
          chmod +x "$HOME/.local/bin/cffs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --- bastok -----------------------------------------------------------
      # `build-embeds.mjs --check` re-tokenizes every BASIC listing a chapter
      # offers to run and fails if the checked-in payload has drifted from it.
      # Same wrapper treatment as cffs: the builder shells out to a `bastok` on
      # PATH rather than an overridable command.
      - name: Checkout bastok
        uses: actions/checkout@v7
        with:
          repository: acwright/bastok
          ref: ${{ env.BASTOK_REF }}
          path: .bastok

      - name: Build bastok
        working-directory: .bastok
        run: |
          npm ci
          npm run build

      - name: Put bastok on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec node "%s/.bastok/dist/index.js" "$@"\n' "$GITHUB_WORKSPACE" > "$HOME/.local/bin/bastok"
          chmod +x "$HOME/.local/bin/bastok"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --- cc65 -------------------------------------------------------------
      # The recipe from 6502-BIOS/README.md: `bin` builds the tools, `none`
      # builds the single target library `cl65 -t none` hands to the linker.
      # Skipping cc65's thirty-odd other targets is what keeps this to a minute.
      - name: Cache cc65
        id: cc65-cache
        uses: actions/cache@v4
        with:
          path: ~/.cc65
          key: cc65-${{ runner.os }}-${{ env.CC65_REF }}

      - name: Build cc65
        if: steps.cc65-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$CC65_REF" https://github.com/cc65/cc65.git .cc65-src
          make -C .cc65-src -j"$(nproc)" bin PREFIX="$HOME/.cc65"
          # Asking cc65 for one target by name skips the pass that would have
          # created lib/, so make it first.
          mkdir -p .cc65-src/lib
          make -C .cc65-src -j"$(nproc)" none PREFIX="$HOME/.cc65"
          make -C .cc65-src/src    install PREFIX="$HOME/.cc65"
          make -C .cc65-src/libsrc install PREFIX="$HOME/.cc65"

      - name: Put cc65 on PATH
        run: |
          echo "$HOME/.cc65/bin" >> "$GITHUB_PATH"
          # BASIC.asm's `.macpack longbranch` is read from cc65's asminc, so the
          # tools alone are not enough — point them at the installed share tree.
          echo "CC65_HOME=$HOME/.cc65/share/cc65" >> "$GITHUB_ENV"

      # --- Checks -----------------------------------------------------------
      - name: Toolchain preflight
        run: npm run preflight

      - name: Run the sample harness
        run: npm run verify

      - name: Build docs
        run: npm run docs:build

      # VitePress checks dead links between Markdown pages and nothing else.
      # This reads the build: component `src`s, the raw HTML cards, every
      # anchor, and the network. A host that refuses the runner is reported as
      # unchecked rather than failed — an HTTP 404 is a broken link, a reset
      # connection is not an answer.
      - name: Check every link
        # GitHub's API answers sixty anonymous requests an hour *per address*,
        # and a runner's address is shared with every other Actions job on it.
        # The token raises that to five thousand, which is the difference
        # between this step checking the sibling repos and reporting that it
        # could not.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run links
