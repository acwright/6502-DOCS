# Linker config for the docs' assembly samples.
#
# A RAM program: it loads at $0800, where BASIC keeps its program text, and
# runs up to the top of usable RAM at $8000. This is the same shape as the
# config shipped with the 6502-PRG template, which Phase 5 documents in full.

MEMORY {
  RAM: start=$0800, size=$7800, file="%O";
}

SEGMENTS {
  CODE: load=RAM, type=rw;
}
