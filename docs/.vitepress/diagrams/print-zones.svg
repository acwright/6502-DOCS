<text class="dg-n" x="30" y="188" text-anchor="start">Three zones fit. The fourth has nowhere to go, so it starts the next line.</text>
<text class="dg-n" x="30" y="206" text-anchor="start">A semicolon does none of this: it prints straight on, with no gap.</text>
