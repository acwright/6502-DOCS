<svg class="dg" viewBox="0 0 620 438" role="img" aria-label="The eight I/O slots between $8000 and $9FFF"
 xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
<title>The eight I/O slots between $8000 and $9FFF</title>
<defs>
<marker id="dg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
 orient="auto-start-reverse"><path class="dg-head" d="M0 0 L8 4 L0 8 z"/></marker>
</defs>
<text class="dg-t" x="120" y="22" text-anchor="start">The hardware window, $8000 to $9FFF</text>
<text class="dg-n" x="120" y="40" text-anchor="start">Eight slots of one kilobyte, one card each</text>
<rect class="dg-r" x="120" y="52" width="300" height="38"/>
<text class="dg-a" x="110" y="76" text-anchor="end">$8000</text>
<rect class="dg-solid" x="128" y="59" width="24" height="24" rx="3"/>
<text class="dg-a dg-inv" x="140" y="76" text-anchor="middle">1</text>
<text class="dg-t" x="162" y="76" text-anchor="start">RAM Card</text>
<text class="dg-n" x="434" y="76" text-anchor="start">AS6C4008 banked SRAM (low)</text>
<rect class="dg-r" x="120" y="94" width="300" height="38"/>
<text class="dg-a" x="110" y="118" text-anchor="end">$8400</text>
<rect class="dg-solid" x="128" y="101" width="24" height="24" rx="3"/>
<text class="dg-a dg-inv" x="140" y="118" text-anchor="middle">2</text>
<text class="dg-t" x="162" y="118" text-anchor="start">RAM Card</text>
<text class="dg-n" x="434" y="118" text-anchor="start">AS6C4008 banked SRAM (high)</text>
<rect class="dg-r" x="120" y="136" width="300" height="38"/>
<text class="dg-a" x="110" y="160" text-anchor="end">$8800</text>
<rect class="dg-solid" x="128" y="143" width="24" height="24" rx="3"/>
<text class="dg-a dg-inv" x="140" y="160" text-anchor="middle">3</text>
<text class="dg-t" x="162" y="160" text-anchor="start">RTC Card</text>
<text class="dg-n" x="434" y="160" text-anchor="start">DS1511Y</text>
<rect class="dg-r" x="120" y="178" width="300" height="38"/>
<text class="dg-a" x="110" y="202" text-anchor="end">$8C00</text>
<rect class="dg-solid" x="128" y="185" width="24" height="24" rx="3"/>
<text class="dg-a dg-inv" x="140" y="202" text-anchor="middle">4</text>
<text class="dg-t" x="162" y="202" text-anchor="start">Storage Card</text>
<text class="dg-n" x="434" y="202" text-anchor="start">CompactFlash (8-bit True IDE)</text>
<rect class="dg-r" x="120" y="220" width="300" height="38"/>
<text class="dg-a" x="110" y="244" text-anchor="end">$9000</text>
<rect class="dg-solid" x="128" y="227" width="24" height="24" rx="3"/>
<text class="dg-a dg-inv" x="140" y="244" text-anchor="middle">5</text>
<text class="dg-t" x="162" y="244" text-anchor="start">Serial Card</text>
<text class="dg-n" x="434" y="244" text-anchor="start">R65C51 / W65C51 ACIA</text>
<rect class="dg-r" x="120" y="262" width="300" height="38"/>
<text class="dg-a" x="110" y="286" text-anchor="end">$9400</text>
<rect class="dg-solid" x="128" y="269" width="24" height="24" rx="3"/>
<text class="dg-a dg-inv" x="140" y="286" text-anchor="middle">6</text>
<text class="dg-t" x="162" y="286" text-anchor="start">GPIO Card / Input Board</text>
<text class="dg-n" x="434" y="286" text-anchor="start">W65C22 VIA</text>
<rect class="dg-r" x="120" y="304" width="300" height="38"/>
<text class="dg-a" x="110" y="328" text-anchor="end">$9800</text>
<rect class="dg-solid" x="128" y="311" width="24" height="24" rx="3"/>
<text class="dg-a dg-inv" x="140" y="328" text-anchor="middle">7</text>
<text class="dg-t" x="162" y="328" text-anchor="start">Sound Card</text>
<text class="dg-n" x="434" y="328" text-anchor="start">MOS 6581 SID / ARMSID</text>
<rect class="dg-r" x="120" y="346" width="300" height="38"/>
<text class="dg-a" x="110" y="370" text-anchor="end">$9C00</text>
<rect class="dg-solid" x="128" y="353" width="24" height="24" rx="3"/>
<text class="dg-a dg-inv" x="140" y="370" text-anchor="middle">8</text>
<text class="dg-t" x="162" y="370" text-anchor="start">Video Card / VGA Card</text>
<text class="dg-n" x="434" y="370" text-anchor="start">TMS9918A / Pico9918</text>
<text class="dg-n" x="120" y="404" text-anchor="start">The Reset probe writes one bit per slot to $030D, in slot order.</text>
<text class="dg-n" x="120" y="422" text-anchor="start">MEM prints it as HW=$xx; from BASIC it is PEEK(781).</text>
</svg>
