<svg class="dg" viewBox="0 0 640 756.3398719722509" role="img" aria-label="The 64K address space, from zero page to the processor vectors"
 xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
<title>The 64K address space, from zero page to the processor vectors</title>
<defs>
<marker id="dg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
 orient="auto-start-reverse"><path class="dg-head" d="M0 0 L8 4 L0 8 z"/></marker>
</defs>
<text class="dg-t" x="150" y="22" text-anchor="start">The 64K address space</text>
<text class="dg-a" x="140" y="39" text-anchor="end">$FFFF</text>
<rect class="dg-r2" x="150" y="34" width="250" height="30"/>
<text class="dg-t" x="162" y="54" text-anchor="start">Vectors</text>
<text class="dg-a" x="140" y="69" text-anchor="end">$FFFA</text>
<text class="dg-n" x="412" y="53" text-anchor="start">6 bytes</text>
<rect class="dg-r2" x="150" y="64" width="250" height="30"/>
<text class="dg-t" x="162" y="84" text-anchor="start">Wozmon</text>
<text class="dg-a" x="140" y="99" text-anchor="end">$FF00</text>
<text class="dg-n" x="412" y="83" text-anchor="start">250 bytes</text>
<rect class="dg-r2" x="150" y="94" width="250" height="56.1"/>
<text class="dg-t" x="162" y="127" text-anchor="start">Monitor</text>
<text class="dg-a" x="140" y="155.1" text-anchor="end">$EE00</text>
<text class="dg-n" x="412" y="126" text-anchor="start">4.3 KB</text>
<rect class="dg-r2" x="150" y="150.1" width="250" height="92.2"/>
<text class="dg-t" x="162" y="201.2" text-anchor="start">BASIC</text>
<text class="dg-a" x="140" y="247.3" text-anchor="end">$C000</text>
<text class="dg-n" x="412" y="200.2" text-anchor="start">11.5 KB</text>
<rect class="dg-r2" x="150" y="242.3" width="250" height="38.5"/>
<text class="dg-t" x="162" y="266.5" text-anchor="start">Character set</text>
<text class="dg-a" x="140" y="285.8" text-anchor="end">$B800</text>
<text class="dg-n" x="412" y="265.5" text-anchor="start">2 KB</text>
<rect class="dg-r2" x="150" y="280.8" width="250" height="66.6"/>
<text class="dg-t" x="162" y="319.1" text-anchor="start">Kernal</text>
<text class="dg-a" x="140" y="352.4" text-anchor="end">$A000</text>
<text class="dg-n" x="412" y="318.1" text-anchor="start">6 KB</text>
<rect class="dg-r3" x="150" y="347.4" width="250" height="76.9"/>
<text class="dg-t" x="162" y="390.9" text-anchor="start">Eight I/O slots</text>
<text class="dg-a" x="140" y="429.3" text-anchor="end">$8000</text>
<text class="dg-n" x="412" y="389.9" text-anchor="start">8 KB</text>
<rect class="dg-r" x="150" y="424.3" width="250" height="112"/>
<text class="dg-t" x="162" y="485.3" text-anchor="start">Program RAM</text>
<text class="dg-a" x="140" y="541.3" text-anchor="end">$0800</text>
<text class="dg-n" x="412" y="484.3" text-anchor="start">30 KB</text>
<rect class="dg-r" x="150" y="536.3" width="250" height="30"/>
<text class="dg-t" x="162" y="556.3" text-anchor="start">CompactFlash sector buffer</text>
<text class="dg-a" x="140" y="571.3" text-anchor="end">$0600</text>
<text class="dg-n" x="412" y="555.3" text-anchor="start">512 bytes</text>
<rect class="dg-r" x="150" y="566.3" width="250" height="30"/>
<text class="dg-t" x="162" y="586.3" text-anchor="start">BASIC line buffers</text>
<text class="dg-a" x="140" y="601.3" text-anchor="end">$0400</text>
<text class="dg-n" x="412" y="585.3" text-anchor="start">512 bytes</text>
<rect class="dg-r" x="150" y="596.3" width="250" height="30"/>
<text class="dg-t" x="162" y="616.3" text-anchor="start">Kernal variables</text>
<text class="dg-a" x="140" y="631.3" text-anchor="end">$0300</text>
<text class="dg-n" x="412" y="615.3" text-anchor="start">256 bytes</text>
<rect class="dg-r" x="150" y="626.3" width="250" height="30"/>
<text class="dg-t" x="162" y="646.3" text-anchor="start">Keyboard ring buffer</text>
<text class="dg-a" x="140" y="661.3" text-anchor="end">$0200</text>
<text class="dg-n" x="412" y="645.3" text-anchor="start">256 bytes</text>
<rect class="dg-r" x="150" y="656.3" width="250" height="30"/>
<text class="dg-t" x="162" y="676.3" text-anchor="start">CPU stack</text>
<text class="dg-a" x="140" y="691.3" text-anchor="end">$0100</text>
<text class="dg-n" x="412" y="675.3" text-anchor="start">256 bytes</text>
<rect class="dg-r" x="150" y="686.3" width="250" height="30"/>
<text class="dg-t" x="162" y="706.3" text-anchor="start">Zero page</text>
<text class="dg-a" x="140" y="721.3" text-anchor="end">$0000</text>
<text class="dg-n" x="412" y="705.3" text-anchor="start">256 bytes</text>
<path class="dg-l" d="M96 424.3 H88 V716.3 H96"/>
<text class="dg-t" x="80" y="570.3" text-anchor="middle" transform="rotate(-90 80 570.3)">RAM</text>
<path class="dg-l" d="M96 347.4 H88 V424.3 H96"/>
<text class="dg-t" x="80" y="385.9" text-anchor="middle" transform="rotate(-90 80 385.9)">I/O</text>
<path class="dg-l" d="M96 34 H88 V347.4 H96"/>
<text class="dg-t" x="80" y="190.7" text-anchor="middle" transform="rotate(-90 80 190.7)">ROM</text>
<text class="dg-n" x="150" y="750.3" text-anchor="start">Your program loads at $0800. Everything from $8000 up is cards and ROM.</text>
</svg>
