<svg class="dg" viewBox="0 0 640 687.8130890776281" role="img" aria-label="The 64K address space, from zero page to the processor vectors"
 xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
<title>The 64K address space, from zero page to the processor vectors</title>
<defs>
<marker id="dg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
 orient="auto-start-reverse"><path class="dg-head" d="M0 0 L8 4 L0 8 z"/></marker>
</defs>
<text class="dg-t" x="150" y="22" text-anchor="start">The 64K address space</text>
<text class="dg-a" x="140" y="39" text-anchor="end">$FFFF</text>
<rect class="dg-r2" x="150" y="34" width="250" height="30"/>
<text class="dg-t" x="162" y="54" text-anchor="start">Vectors</text>
<text class="dg-a" x="140" y="69" text-anchor="end">$FFFA</text>
<text class="dg-n" x="412" y="53" text-anchor="start">6 bytes</text>
<rect class="dg-r2" x="150" y="64" width="250" height="30"/>
<text class="dg-t" x="162" y="84" text-anchor="start">Wozmon</text>
<text class="dg-a" x="140" y="99" text-anchor="end">$FF00</text>
<text class="dg-n" x="412" y="83" text-anchor="start">250 bytes</text>
<rect class="dg-r2" x="150" y="94" width="250" height="107.9"/>
<text class="dg-t" x="162" y="153" text-anchor="start">BASIC</text>
<text class="dg-a" x="140" y="206.9" text-anchor="end">$C000</text>
<text class="dg-n" x="412" y="152" text-anchor="start">15.8 KB</text>
<rect class="dg-r2" x="150" y="201.9" width="250" height="76.9"/>
<text class="dg-t" x="162" y="245.4" text-anchor="start">Kernal</text>
<text class="dg-a" x="140" y="283.9" text-anchor="end">$A000</text>
<text class="dg-n" x="412" y="244.4" text-anchor="start">8 KB</text>
<rect class="dg-r3" x="150" y="278.9" width="250" height="76.9"/>
<text class="dg-t" x="162" y="322.3" text-anchor="start">Eight I/O slots</text>
<text class="dg-a" x="140" y="360.8" text-anchor="end">$8000</text>
<text class="dg-n" x="412" y="321.3" text-anchor="start">8 KB</text>
<rect class="dg-r" x="150" y="355.8" width="250" height="112"/>
<text class="dg-t" x="162" y="416.8" text-anchor="start">Program RAM</text>
<text class="dg-a" x="140" y="472.8" text-anchor="end">$0800</text>
<text class="dg-n" x="412" y="415.8" text-anchor="start">30 KB</text>
<rect class="dg-r" x="150" y="467.8" width="250" height="30"/>
<text class="dg-t" x="162" y="487.8" text-anchor="start">CompactFlash sector buffer</text>
<text class="dg-a" x="140" y="502.8" text-anchor="end">$0600</text>
<text class="dg-n" x="412" y="486.8" text-anchor="start">512 bytes</text>
<rect class="dg-r" x="150" y="497.8" width="250" height="30"/>
<text class="dg-t" x="162" y="517.8" text-anchor="start">BASIC line buffers</text>
<text class="dg-a" x="140" y="532.8" text-anchor="end">$0400</text>
<text class="dg-n" x="412" y="516.8" text-anchor="start">512 bytes</text>
<rect class="dg-r" x="150" y="527.8" width="250" height="30"/>
<text class="dg-t" x="162" y="547.8" text-anchor="start">Kernal variables</text>
<text class="dg-a" x="140" y="562.8" text-anchor="end">$0300</text>
<text class="dg-n" x="412" y="546.8" text-anchor="start">256 bytes</text>
<rect class="dg-r" x="150" y="557.8" width="250" height="30"/>
<text class="dg-t" x="162" y="577.8" text-anchor="start">Keyboard ring buffer</text>
<text class="dg-a" x="140" y="592.8" text-anchor="end">$0200</text>
<text class="dg-n" x="412" y="576.8" text-anchor="start">256 bytes</text>
<rect class="dg-r" x="150" y="587.8" width="250" height="30"/>
<text class="dg-t" x="162" y="607.8" text-anchor="start">CPU stack</text>
<text class="dg-a" x="140" y="622.8" text-anchor="end">$0100</text>
<text class="dg-n" x="412" y="606.8" text-anchor="start">256 bytes</text>
<rect class="dg-r" x="150" y="617.8" width="250" height="30"/>
<text class="dg-t" x="162" y="637.8" text-anchor="start">Zero page</text>
<text class="dg-a" x="140" y="652.8" text-anchor="end">$0000</text>
<text class="dg-n" x="412" y="636.8" text-anchor="start">256 bytes</text>
<path class="dg-l" d="M96 355.8 H88 V647.8 H96"/>
<text class="dg-t" x="80" y="501.8" text-anchor="middle" transform="rotate(-90 80 501.8)">RAM</text>
<path class="dg-l" d="M96 278.9 H88 V355.8 H96"/>
<text class="dg-t" x="80" y="317.3" text-anchor="middle" transform="rotate(-90 80 317.3)">I/O</text>
<path class="dg-l" d="M96 34 H88 V278.9 H96"/>
<text class="dg-t" x="80" y="156.4" text-anchor="middle" transform="rotate(-90 80 156.4)">ROM</text>
<text class="dg-n" x="150" y="681.8" text-anchor="start">Your program loads at $0800. Everything from $8000 up is cards and ROM.</text>
</svg>
