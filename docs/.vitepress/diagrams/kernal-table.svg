<svg class="dg" viewBox="0 0 660 366" role="img" aria-label="How a Kernal call reaches the routine"
 xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
<title>How a Kernal call reaches the routine</title>
<defs>
<marker id="dg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
 orient="auto-start-reverse"><path class="dg-head" d="M0 0 L8 4 L0 8 z"/></marker>
</defs>
<text class="dg-t" x="30" y="24" text-anchor="start">What jsr Chrout actually does</text>
<text class="dg-n" x="30" y="42" text-anchor="start">53 slots, 3 bytes each, from $A000</text>
<rect class="dg-r" x="30" y="60" width="170" height="56" rx="3"/><text class="dg-t" x="115" y="86" text-anchor="middle">Your program</text><text class="dg-a" x="115" y="102" text-anchor="middle">jsr $A000</text>
<line class="dg-l" x1="200" y1="88" x2="232" y2="88" marker-end="url(#dg-arrow)"/>
<rect class="dg-solid" x="232" y="60" width="190" height="56" rx="3"/><text class="dg-t dg-inv" x="327" y="86" text-anchor="middle">The jump table</text><text class="dg-a" x="327" y="102" text-anchor="middle">jmp ChroutDispatch</text>
<line class="dg-l" x1="422" y1="88" x2="454" y2="88" marker-end="url(#dg-arrow)"/>
<rect class="dg-r" x="454" y="60" width="176" height="56" rx="3"/><text class="dg-t" x="542" y="86" text-anchor="middle">The routine</text><text class="dg-a" x="542" y="102" text-anchor="middle">somewhere in ROM</text>
<rect class="dg-r" x="232" y="156" width="190" height="26"/>
<text class="dg-a" x="244" y="174" text-anchor="start">$A000</text>
<text class="dg-t" x="318" y="174" text-anchor="start">Chrout</text>
<rect class="dg-r" x="232" y="186" width="190" height="26"/>
<text class="dg-a" x="244" y="204" text-anchor="start">$A003</text>
<text class="dg-t" x="318" y="204" text-anchor="start">Chrin</text>
<rect class="dg-r" x="232" y="216" width="190" height="26"/>
<text class="dg-a" x="244" y="234" text-anchor="start">$A006</text>
<text class="dg-t" x="318" y="234" text-anchor="start">WriteBuffer</text>
<rect class="dg-r" x="232" y="246" width="190" height="26"/>
<text class="dg-a" x="244" y="264" text-anchor="start">$A009</text>
<text class="dg-t" x="318" y="264" text-anchor="start">ReadBuffer</text>
<text class="dg-a" x="244" y="292" text-anchor="start">…</text>
<line class="dg-l dg-dash" x1="232" y1="120" x2="232" y2="296"/>
<line class="dg-l dg-dash" x1="422" y1="120" x2="422" y2="296"/>
<text class="dg-n" x="30" y="330" text-anchor="start">The routine moves whenever the ROM is rebuilt. The slot does not — which is the</text>
<text class="dg-n" x="30" y="348" text-anchor="start">whole point of it. Call the slot, never the address you found the code at.</text>
</svg>
