<svg class="dg" viewBox="0 0 620 330" role="img" aria-label="A CompactFlash card, its 256 disks, and the sixteen files on a disk"
 xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
<title>A CompactFlash card, its 256 disks, and the sixteen files on a disk</title>
<defs>
<marker id="dg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
 orient="auto-start-reverse"><path class="dg-head" d="M0 0 L8 4 L0 8 z"/></marker>
</defs>
<text class="dg-t" x="40" y="24" text-anchor="start">One card, 256 disks, 16 files each</text>
<rect class="dg-r2" x="40" y="46" width="150" height="74" rx="3"/><text class="dg-t" x="115" y="81" text-anchor="middle">CompactFlash</text><text class="dg-a" x="115" y="97" text-anchor="middle">one card</text>
<rect class="dg-solid" x="250" y="46" width="40" height="74"/>
<text class="dg-a dg-inv" x="270" y="88" text-anchor="middle">0</text>
<rect class="dg-r" x="296" y="46" width="40" height="74"/>
<text class="dg-a" x="316" y="88" text-anchor="middle">1</text>
<rect class="dg-r" x="342" y="46" width="40" height="74"/>
<text class="dg-a" x="362" y="88" text-anchor="middle">2</text>
<rect class="dg-r" x="388" y="46" width="40" height="74"/>
<text class="dg-a" x="408" y="88" text-anchor="middle">3</text>
<rect class="dg-r" x="434" y="46" width="40" height="74"/>
<text class="dg-a" x="454" y="88" text-anchor="middle">4</text>
<rect class="dg-r" x="480" y="46" width="40" height="74"/>
<text class="dg-a" x="500" y="88" text-anchor="middle">…</text>
<text class="dg-n" x="250" y="138" text-anchor="start">Disk 0 to disk 255, one megabyte each. DISK n picks one.</text>
<line class="dg-l" x1="200" y1="83" x2="240" y2="83" marker-end="url(#dg-arrow)"/>
<line class="dg-l" x1="270" y1="122" x2="270" y2="166" marker-end="url(#dg-arrow)"/>
<rect class="dg-r" x="210" y="176" width="300" height="108"/>
<text class="dg-t" x="222" y="200" text-anchor="start">Disk 0</text>
<line class="dg-l dg-dash" x1="222" y1="212" x2="350" y2="212"/>
<line class="dg-l dg-dash" x1="222" y1="229" x2="350" y2="229"/>
<line class="dg-l dg-dash" x1="222" y1="246" x2="350" y2="246"/>
<line class="dg-l dg-dash" x1="222" y1="263" x2="350" y2="263"/>
<text class="dg-n" x="370" y="220" text-anchor="start">Sixteen files.</text>
<text class="dg-n" x="370" y="238" text-anchor="start">Eight characters, a dot,</text>
<text class="dg-n" x="370" y="256" text-anchor="start">three more: GAME.PRG.</text>
<text class="dg-a" x="40" y="176" text-anchor="start">DIR</text>
<text class="dg-n" x="40" y="196" text-anchor="start">lists the disk</text>
<text class="dg-a" x="40" y="220" text-anchor="start">DISK 3</text>
<text class="dg-n" x="40" y="240" text-anchor="start">moves to another</text>
<text class="dg-a" x="40" y="264" text-anchor="start">FORMAT</text>
<text class="dg-n" x="40" y="284" text-anchor="start">empties the one</text>
<text class="dg-n" x="40" y="300" text-anchor="start">you're on</text>
</svg>
