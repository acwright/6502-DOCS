<svg class="dg" viewBox="0 0 640 440" role="img" aria-label="The XModem handshake between a laptop and the ACE"
 xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
<title>The XModem handshake between a laptop and the ACE</title>
<defs>
<marker id="dg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
 orient="auto-start-reverse"><path class="dg-head" d="M0 0 L8 4 L0 8 z"/></marker>
</defs>
<text class="dg-t" x="120" y="26" text-anchor="middle">The sender</text>
<text class="dg-t" x="400" y="26" text-anchor="middle">The ACE</text>
<text class="dg-n" x="120" y="44" text-anchor="middle">your laptop</text>
<text class="dg-n" x="400" y="44" text-anchor="middle">waiting in LOAD</text>
<line class="dg-l dg-dash" x1="120" y1="56" x2="120" y2="396"/>
<line class="dg-l dg-dash" x1="400" y1="56" x2="400" y2="396"/>
<line class="dg-l" x1="400" y1="64" x2="120" y2="64" marker-end="url(#dg-arrow)"/>
<text class="dg-a" x="260" y="56" text-anchor="middle">NAK</text>
<text class="dg-n" x="440" y="68" text-anchor="start">ready when you are</text>
<line class="dg-l" x1="120" y1="110" x2="400" y2="110" marker-end="url(#dg-arrow)"/>
<text class="dg-a" x="260" y="102" text-anchor="middle">SOH  block 1  128 bytes  checksum</text>
<line class="dg-l" x1="400" y1="156" x2="120" y2="156" marker-end="url(#dg-arrow)"/>
<text class="dg-a" x="260" y="148" text-anchor="middle">ACK</text>
<text class="dg-n" x="440" y="160" text-anchor="start">got it, send the next</text>
<line class="dg-l" x1="120" y1="202" x2="400" y2="202" marker-end="url(#dg-arrow)"/>
<text class="dg-a" x="260" y="194" text-anchor="middle">SOH  block 2  …</text>
<line class="dg-l" x1="400" y1="248" x2="120" y2="248" marker-end="url(#dg-arrow)"/>
<text class="dg-a" x="260" y="240" text-anchor="middle">ACK</text>
<line class="dg-l" x1="120" y1="294" x2="400" y2="294" marker-end="url(#dg-arrow)"/>
<text class="dg-a" x="260" y="286" text-anchor="middle">EOT</text>
<text class="dg-n" x="440" y="298" text-anchor="start">that was the last one</text>
<line class="dg-l" x1="400" y1="340" x2="120" y2="340" marker-end="url(#dg-arrow)"/>
<text class="dg-a" x="260" y="332" text-anchor="middle">ACK</text>
<text class="dg-n" x="30" y="422" text-anchor="start">A block that arrives damaged is answered with NAK and sent again, up to ten times.</text>
</svg>
